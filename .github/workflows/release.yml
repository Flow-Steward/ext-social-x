name: Publish approved X extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved immutable tag matching extension.yaml; wait for the coordinated release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: Flow-Steward/extensions/.github/workflows/release-extension.yml@296fa16dfec746f80c26bc05663ed9832c2043c2
    with:
      tag: ${{ inputs.tag }}
      expected_visibility: private
