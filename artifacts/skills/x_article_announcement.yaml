skill_id: x_article_announcement
version: 1.0.0
display_name: X article announcement
description: Write an accurate short teaser using only supplied published article
  data. Do not invent claims. Exclude the canonical URL because the following validator
  appends it intact. Return announcement_text within ordinary X 280 weighted characters
  including room for the URL.
enabled: true
category: marketing
instructions:
- Write an accurate short teaser using only supplied published article data. Do not
  invent claims. Exclude the canonical URL because the following validator appends
  it intact. Return announcement_text within ordinary X 280 weighted characters including
  room for the URL.
expected_inputs:
- name: title
  type: text
  required: true
  description: Title of the published article.
- name: content
  type: paragraph
  required: false
  description: Published article body when available.
- name: excerpt
  type: paragraph
  required: false
  description: Published article excerpt when available.
- name: canonical_url
  type: text
  required: true
  description: Full article URL appended by the following validator.
expected_outputs:
- name: announcement_text
  type: text
  required: true
